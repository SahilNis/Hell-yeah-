<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Little Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16000d, #4b001f, #16000d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            width: min(90%, 500px);
            padding: 35px 25px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(255, 0, 100, 0.25);
            position: relative;
            z-index: 5;
        }

        .emoji {
            font-size: 65px;
            animation: bounce 1.5s infinite;
        }

        h1 {
            font-size: 32px;
            margin: 15px 0;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        .open-btn {
            background: #ff3b81;
            color: white;
            box-shadow: 0 0 20px rgba(255, 59, 129, 0.5);
        }

        .yes-btn {
            background: #ff3b81;
            color: white;
        }

        .no-btn {
            background: white;
            color: #222;
        }

        .buttons {
            margin-top: 25px;
        }

        #proposal,
        #success {
            display: none;
        }

        #noMessage {
            min-height: 30px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffb6d2;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear forwards;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 10;
            pointer-events: none;
            animation: fall 3s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 27px;
            }

            .card {
                padding: 30px 18px;
            }

            button {
                padding: 13px 24px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- OPENING SCREEN -->
    <div id="opening" class="screen">
        <div class="card">

            <div class="emoji">💌</div>

            <h1>I have something for you...</h1>

            <p>Just one little thing. ❤️</p>

            <button class="open-btn" onclick="openProposal()">
                Tap to open ❤️
            </button>

        </div>
    </div>


    <!-- PROPOSAL -->
    <div id="proposal" class="screen">

        <div class="card">

            <div class="emoji">🥹❤️</div>

            <h1>Will you be mine?</h1>

            <p id="noMessage">Choose carefully 👀</p>

            <div class="buttons">

                <button class="yes-btn" onclick="sayYes()">
                    YES ❤️
                </button>

                <button class="no-btn" onclick="sayNo()">
                    NO
                </button>

            </div>

        </div>

    </div>


    <!-- SUCCESS -->
    <div id="success" class="screen">

        <div class="card">

            <div class="emoji">😭❤️</div>

            <h1>YAYYYYY! 🎉</h1>

            <p>Thank you for saying YES! ❤️</p>

        </div>

    </div>


    <!-- MUSIC -->
    <audio id="music" preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>


    <script>

        /* ==============================
           GOOGLE SHEETS
        ============================== */

        const SCRIPT_URL =
       https://script.google.com/macros/s/AKfycbzn04GIdWWRMNAslhdJgbNNN3z_yM0WE4hDFveJrthu7_1W2IqiqS2sWGtT5beOUag0/exec


        function recordResponse(response) {

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type":
                    "application/x-www-form-urlencoded"
                },
                body:
                    "response=" +
                    encodeURIComponent(response)
            }).catch(() => {});

        }


        /* ==============================
           OPEN PROPOSAL
        ============================== */

        function openProposal() {

            const music =
                document.getElementById("music");

            /* Start song from 0:28 */

            music.currentTime = 28;

            music.play().catch(() => {});


            document.getElementById("opening")
                .style.display = "none";

            document.getElementById("proposal")
                .style.display = "flex";


            startHearts();

        }


        /* ==============================
           NO BUTTON
        ============================== */

        let noCount = 0;

        let noRecorded = false;


        const messages = [

            "Please 🥺❤️",
            "Think again 😭",
            "Are you sure? 🥹",
            "Pleaseeeeee 🥺👉👈",
            "Don't do this to me 😭💔",
            "One more chance? 🥹❤️",
            "I really like you 👉👈",
            "You're breaking my heart 😭💔",
            "Pretty please? 🥺💗",
            "Just say YESSS 😭❤️",
            "Come onnnn 🥹🫶🏻",
            "I'll be waiting 👀❤️",
            "Okay... last chance 🥺",
            "PLEASEEEEE 😭❤️",
            "You sure about that? 👀",
            "Just give me a chance 🥹❤️",
            "Don't click NO again 😭",
            "My heart says YES ❤️",
            "Please reconsider 🥺👉👈",
            "Last last chance? 😭❤️",
            "Waittt 😭❤️",
            "Don't leave me hanging 🥺",
            "Please don't say no 😭",
            "Just think about it 🥹",
            "Can I get one chance? 🫶🏻",
            "Pretty pleaseee? 🥺",
            "You're making me nervous 😭",
            "Okay okay... reconsider? 👀",
            "Don't break my heart 💔🥹",
            "I'll take that as a maybe 👀",
            "Just one YES? ❤️",
            "Pleaseeee I'm asking nicely 😭👉👈",
            "Are you really sure? 🥺",
            "Look at that YES button 👀❤️",
            "Maybe your heart says YES? 🥹",
            "Don't be shy 😭❤️",
            "Come on, you know the answer 👀",
            "Okay... I'll wait 🥺",
            "One tiny YES? 🫶🏻",
            "Please choose YES ❤️",
            "Still thinking? 😭",
            "Take your time... but YES? 🥹",
            "You're making this difficult 😂❤️",
            "Okay, I'm still hopeful 🥺",
            "Just one chance? 🥹❤️",
            "Don't give up on this so quickly 😭❤️",
            "I'm still waiting 👀❤️",
            "Maybe try YES this time? 😂❤️",
            "Nooo don't click that 😭",
            "Pleaseee, hear me out 🥺",
            "One more thought? ❤️",
            "Okay okay... I'll keep asking 😂",
            "You can't leave me with NO 😭❤️",
            "I'm still waiting for that YES 👀❤️",
            "One little YES? 🥹",
            "Please don't be mean 😭❤️",
            "Okay... maybe YES? 👀",
            "Give YES a chance 🫶🏻"
        ];


        function sayNo() {

            noCount++;


            /* Record only the first NO */

            if (!noRecorded) {

                recordResponse("NO 😭");

                noRecorded = true;

            }


            /* ONLY CHANGE THE WORDS */

            const message =
                document.getElementById("noMessage");


            const index =
                Math.min(
                    noCount - 1,
                    messages.length - 1
                );


            message.textContent =
                messages[index];

        }


        /* ==============================
           YES BUTTON
        ============================== */

        function sayYes() {

            recordResponse("YES ❤️");


            document.getElementById("proposal")
                .style.display = "none";


            document.getElementById("success")
                .style.display = "flex";


            createConfetti();

            startHearts();

        }


        /* ==============================
           FLOATING HEARTS
        ============================== */

        function startHearts() {

            setInterval(() => {

                const heart =
                    document.createElement("div");


                heart.className = "heart";

                heart.textContent =
                    ["❤️", "💗", "💕", "💖", "💘"]
                    [Math.floor(Math.random() * 5)];


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";


                heart.style.animationDuration =
                    (4 + Math.random() * 5) + "s";


                document.body.appendChild(heart);


                setTimeout(() => {

                    heart.remove();

                }, 9000);


            }, 500);

        }


        /* ==============================
           CONFETTI
        ============================== */

        function createConfetti() {

            for (let i = 0; i < 100; i++) {

                const piece =
                    document.createElement("div");


                piece.className = "confetti";


                piece.style.left =
                    Math.random() * 100 + "vw";


                piece.style.animationDelay =
                    Math.random() * 2 + "s";


                piece.style.transform =
                    `rotate(${Math.random() * 360}deg)`;


                document.body.appendChild(piece);


                setTimeout(() => {

                    piece.remove();

                }, 5000);

            }

        }

    </script>

</body>
</html>
